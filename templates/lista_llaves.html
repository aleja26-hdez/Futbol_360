{% extends 'base.html' %}
{% block content %}
<h2 class="fw-bold mb-3">Llaves de torneos</h2>
{% for t in torneos %}
  <a href="{% url 'llave_torneo' t.id %}" class="text-decoration-none">
    <div class="card p-3 mb-2">
      <div class="fw-bold">🏆 {{ t.nombre }}</div>
      <div class="text-muted small">{{ t.categoria.nombre }} · {{ t.fecha_inicio|date:"d/m/Y" }} a {{ t.fecha_fin|date:"d/m/Y" }}</div>
    </div>
  </a>
{% empty %}
  <p class="text-muted">No hay torneos disponibles.</p>
{% endfor %}
{% endblock %}
