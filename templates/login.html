{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4" style="box-shadow:0 0 40px rgba(74,222,59,.12);">
            <div class="f-tag mb-2" style="color:var(--f-green);letter-spacing:2px;font-size:.75rem;font-weight:600;">— PLATAFORMA DE GESTIÓN DEPORTIVA</div>
            <h2 class="fw-bold mb-1">Gestiona tu escuela.</h2>
            <h2 class="fw-bold mb-4">Forma <span style="color:var(--f-green);">campeones.</span></h2>

            {% if form.errors %}
                <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
