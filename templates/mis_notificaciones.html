{% extends 'base.html' %}
{% block content %}
<h2>Mis notificaciones</h2>
<table class="table table-bordered">
    <tr><th>Título</th><th>Mensaje</th><th>Fecha</th></tr>
    {% for n in notificaciones %}
    <tr>
        <td>{{ n.titulo }}</td>
        <td>{{ n.mensaje }}</td>
        <td>{{ n.fecha_envio }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3" class="text-muted">No tienes notificaciones todavía</td></tr>
    {% endfor %}
</table>
{% endblock %}
