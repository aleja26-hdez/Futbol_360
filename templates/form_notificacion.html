{% extends 'base.html' %}
{% block content %}
<h2>Enviar notificación</h2>
{% if messages %}{% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Enviar</button>
</form>
{% endblock %}
